name: Backend tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    # Настоящий PostgreSQL для тестов — тот же образ, что в docker-compose
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trip_user
          POSTGRES_PASSWORD: trip_pass
          POSTGRES_DB: trip_planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trip_user -d trip_planner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # быстрые тесты без БД и сети — идут первыми
      - name: Run unit tests
        run: npm run test:unit

      # pretest:e2e сам накатит миграции на trip_planner_test
      - name: Run e2e tests
        run: npm run test:e2e
